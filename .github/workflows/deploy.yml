name: Deploy Wealtharr owner tracker
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: wealtharr-owner-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.WEALTHARR_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Prepare pinned SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.WEALTHARR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.WEALTHARR_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.WEALTHARR_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.WEALTHARR_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_SSH_KEY" "$DEPLOY_KNOWN_HOSTS"; do
            if [ -z "$value" ]; then
              echo "Deployment not configured: set all four production SSH secrets."
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/wealtharr_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/wealtharr_deploy ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/wealtharr_deploy >/dev/null
          echo "SSH key and pinned host identity are configured."

      - name: Deploy commit and check local service health
        env:
          DEPLOY_HOST: ${{ secrets.WEALTHARR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.WEALTHARR_DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.WEALTHARR_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] || exit 2
          ssh -i ~/.ssh/wealtharr_deploy -p "$port" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
              -- "$DEPLOY_USER@$DEPLOY_HOST" \
              "bash -se -- '$GITHUB_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          sha="$1"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 4
          deploy_dir="$HOME/wealtharr_v2"
          if [ ! -d "$deploy_dir/.git" ]; then
            mkdir -p "$deploy_dir"
            if [ -n "$(find "$deploy_dir" -mindepth 1 -maxdepth 1 ! -name '.env' ! -name '.env.production' -print -quit)" ]; then
              echo "Unmanaged files in the deployment directory; refusing to overwrite."
              exit 5
            fi
            git -C "$deploy_dir" init --quiet
            git -C "$deploy_dir" remote add origin https://github.com/Ricas13/wealtharr_v2.git
          fi
          cd "$deploy_dir"
          for required in .env .env.production; do
            if [ ! -f "$required" ]; then
              echo "Missing private server-side $required; deploy will not start."
              exit 6
            fi
          done
          if ! grep -qx 'DEBUG=0' .env.production; then
            echo "Production must use DEBUG=0."
            exit 7
          fi
          git fetch --quiet origin main
          git checkout --quiet -B main FETCH_HEAD
          git reset --hard "$sha" >/dev/null
          docker compose config --quiet
          docker compose up -d --build
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 \
                 -H 'Host: wealtharr.vpn4u.cc' \
                 -H 'X-Forwarded-Proto: https' \
                 http://127.0.0.1:8088/health/ \
                 | grep -q '"status": "ok"'; then
              ok=1
              break
            fi
            sleep 4
          done
          if [ "$ok" != 1 ]; then
            echo "Wealtharr did not pass the local health check."
            docker compose ps
            exit 8
          fi
          docker compose exec -T web python manage.py check --deploy
          docker compose ps
          echo "Wealtharr live owner tracker deployed and healthy on the Oracle host."
          REMOTE

      - name: Validate public HTTPS endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://wealtharr.vpn4u.cc/health/ | grep -q '"status": "ok"'
          echo "Public HTTPS health endpoint confirms the deployed application is reachable."
