name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "1"
      SECRET_KEY: "github-actions-development-only-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify app configuration
        run: python manage.py check
      - name: Verify migrations match models
        run: python manage.py makemigrations --check --dry-run
      - name: Apply schema migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test tracker --verbosity 2
      - name: Compile assets
        run: python manage.py collectstatic --noinput
      - name: Production-mode public page smoke (real manifest and HTTPS)
        env:
          DEBUG: "0"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/wealtharr"
          ALLOWED_HOSTS: "wealtharr.vpn4u.cc"
          CSRF_TRUSTED_ORIGINS: "https://wealtharr.vpn4u.cc"
        run: |
          # Build the manifest in a fresh process where DEBUG=0 at startup.
          python manage.py collectstatic --noinput --clear
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "wealtharr.settings")
          import django
          django.setup()
          from django.test import Client
          client = Client(raise_request_exception=True)
          for path in ("/", "/login/"):
              response = client.get(path, secure=True, HTTP_HOST="wealtharr.vpn4u.cc")
              print(path, response.status_code)
              assert response.status_code == 200, (path, response.status_code)
          PY
      - name: Validate private deployment and recovery configuration
        run: |
          set -eu
          bash -n wealtharr.sh
          bash wealtharr.sh --help
          bash -n scripts/restore_backup.sh
          bash -n scripts/verify_backup.sh
          cp .env.example .env.production
          umask 077
          mkdir -p secrets
          printf 'ci-test-db-only-not-real-secret' > secrets/postgres_password
          printf 'ci-test-django-key-only-not-real-secret' > secrets/django_secret_key
          docker compose config --quiet
          # Regression: Compose must preserve the shell variable in BOTH
          # checksum filenames. A single '$stamp' in YAML is interpolated
          # by Compose before the backup shell executes and produces a
          # permanent unhealthy backup service.
          docker compose config --format json > /tmp/wealtharr-compose.json 2> /tmp/wealtharr-compose-warnings.log
          if grep -qi 'variable is not set' /tmp/wealtharr-compose-warnings.log; then
            cat /tmp/wealtharr-compose-warnings.log >&2
            echo 'Compose expanded backup stamp before the shell ran' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          with open("/tmp/wealtharr-compose.json") as f:
              cfg = json.load(f)
          cmd = cfg["services"]["backups"]["command"]
          script = cmd[-1] if isinstance(cmd, list) else cmd
          checksum_line = next((line for line in script.splitlines() if "sha256sum" in line), "")
          assert checksum_line.count("$completed") >= 2, (
              "Compose stripped the completed archive variable from the checksum command: "
              + checksum_line
          )
          assert ".sha256" in checksum_line
          print("Backup filename shell variables survived Compose interpolation")
          PY
          WEALTHARR_HOST=wealtharr.vpn4u.cc \
          TRAEFIK_DOCKER_NETWORK=ci_private_proxy \
          TRAEFIK_CERT_RESOLVER=ci_resolver \
          docker compose -f compose.yml -f compose.traefik.yml config --format json > /tmp/wealtharr-proxy-config.json
          python - <<'PY'
          import json
          with open("/tmp/wealtharr-proxy-config.json") as f:
              cfg = json.load(f)
          web = cfg["services"]["web"]
          labels = web["labels"]
          if isinstance(labels, list):
              labels = dict(label.split("=", 1) for label in labels)
          assert labels.get("traefik.enable") == "true"
          assert labels["traefik.http.routers.wealtharr.rule"] == "Host(`wealtharr.vpn4u.cc`)"
          assert labels.get("traefik.http.routers.wealtharr.tls") == "true"
          assert labels.get("traefik.http.routers.wealtharr.tls.certresolver") == "ci_resolver"
          assert labels["traefik.http.services.wealtharr.loadbalancer.server.port"] == "8000"
          assert not web.get("ports"), "Private upstream port must not be published"
          assert not any("ipallowlist" in k.lower() or k == "traefik.http.routers.wealtharr.middlewares" for k in labels), (
              "Wealtharr login must have no IP allowlist middleware"
          )
          assert "traefik_private" in web["networks"]
          assert not cfg["services"]["db"].get("ports")
          print("HTTPS public-login router, unexposed backend and no IP allowlist: OK")
          PY
          # Neither Compose path must accidentally publish the database.
          if docker compose config | grep -E '^    ports:' -A 2 | grep -q '5432:'; then
            echo 'PostgreSQL must never be published'; exit 1
          fi
          rm -f secrets/postgres_password secrets/django_secret_key .env.production
          rmdir secrets

      - name: Exercise disposable PostgreSQL backup recovery (synthetic data)
        run: |
          set -eu
          mkdir -p backups
          docker run -d --name wealtharr-ci-restore-source \
            -e POSTGRES_PASSWORD=ci-only-not-a-real-secret \
            -e POSTGRES_DB=ci_restore_source postgres:16-alpine >/dev/null
          trap 'docker rm -f wealtharr-ci-restore-source >/dev/null 2>&1 || true' EXIT
          # Ignore the temporary bootstrap daemon, which cleanly shuts
          # down before the persistent PostgreSQL server comes up.
          initialized=0
          for attempt in $(seq 1 60); do
            if docker logs wealtharr-ci-restore-source 2>&1 | grep -q 'PostgreSQL init process complete' &&
               docker exec wealtharr-ci-restore-source \
                 psql -U postgres -d ci_restore_source -Atqc 'SELECT 1' >/dev/null 2>&1; then
              initialized=1
              break
            fi
            sleep 1
          done
          test "$initialized" = 1 || { echo 'Disposable PostgreSQL failed to start' >&2; exit 1; }
          docker exec wealtharr-ci-restore-source \
            psql -v ON_ERROR_STOP=1 -U postgres -d ci_restore_source \
            -c "CREATE TABLE django_migrations (id bigint primary key, app text not null, name text not null); INSERT INTO django_migrations VALUES (1, 'tracker', 'synthetic_ci');"
          docker exec wealtharr-ci-restore-source \
            pg_dump -U postgres -d ci_restore_source -Fc > backups/wealtharr-ci.dump
          (cd backups && sha256sum wealtharr-ci.dump > wealtharr-ci.dump.sha256)
          bash scripts/verify_backup.sh backups/wealtharr-ci.dump
          rm -f backups/wealtharr-ci.dump backups/wealtharr-ci.dump.sha256

      - name: Public Yahoo chart endpoint smoke (non-gating)
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "wealtharr.settings")
          django.setup()
          from datetime import date
          from tracker.market_signals import fetch_chart
          for ticker, expected in [("LQQ3.L", "GBP"), ("ERNS.L", "GBP"), ("TQQQ", "USD"), ("SPY", "USD")]:
              currency, rows = fetch_chart(ticker, date(2026, 10, 1))
              if currency != expected:
                  raise RuntimeError(f"{ticker}: expected {expected}, got {currency}")
              print(f"Yahoo {ticker}: {currency} as of {rows[-1][0]}, {len(rows)} closes")
          PY

  browser:
    name: Real browser owner journeys (360px and desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "1"
      SECRET_KEY: "github-actions-browser-synthetic-only"
      # Playwright sync starts an event loop in this synthetic test process.
      # Never set this on Gunicorn, reminders, or production.
      DJANGO_ALLOW_ASYNC_UNSAFE: "true"
      WEALTHARR_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and pinned Playwright
        run: python -m pip install -r requirements.txt -r requirements-browser.txt
      - name: Install headless Chromium system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Test real owner journeys in Chromium
        run: python manage.py test browser_tests tracker.test_browser_e2e --verbosity 2
