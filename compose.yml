services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wealtharr
      POSTGRES_USER: wealtharr
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - wealtharr_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealtharr -d wealtharr"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: "postgresql://wealtharr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/wealtharr"
    ports:
      - "127.0.0.1:8088:8000"
    depends_on:
      db:
        condition: service_healthy
  reminders:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: "postgresql://wealtharr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/wealtharr"
    command: ["/bin/sh", "-c", "while true; do python manage.py sync_market_and_signals; python manage.py send_due_notifications; sleep 3600; done"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  wealtharr_db:
