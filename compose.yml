# Private owner deployment. No public web/database listener or broker connection.
# Create ./secrets/postgres_password and ./secrets/django_secret_key
# before starting. Never rotate django_secret_key without an encrypted-data plan.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wealtharr
      POSTGRES_USER: wealtharr
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - wealtharr_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealtharr -d wealtharr"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: wealtharr
      DATABASE_USER: wealtharr
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      SECRET_KEY_FILE: /run/secrets/django_secret_key
    secrets: [postgres_password, django_secret_key]
    # Host/Traefik-accessible only on loopback. External Traefik installations
    # use compose.traefik.yml instead, which REMOVES this port mapping.
    ports: ["127.0.0.1:8088:8000"]
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=64m"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=4).read()"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3

  reminders:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: wealtharr
      DATABASE_USER: wealtharr
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      SECRET_KEY_FILE: /run/secrets/django_secret_key
    secrets: [postgres_password, django_secret_key]
    command: ["/bin/sh", "-ec", "while true; do python manage.py sync_market_and_signals; python manage.py send_cockpit_notifications; sleep 3600; done"]
    depends_on:
      web:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=64m"]

  backups:
    image: postgres:16-alpine
    restart: unless-stopped
    secrets: [postgres_password]
    volumes:
      - ./backups:/backups
    environment:
      PGHOST: db
      PGUSER: wealtharr
      PGDATABASE: wealtharr
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        mkdir -p /backups
        chmod 700 /backups
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pending="/backups/wealtharr-$$stamp.dump.tmp"
          completed="/backups/wealtharr-$$stamp.dump"
          if pg_dump -Fc -f "$$pending" && pg_restore --list "$$pending" >/dev/null; then
            mv "$$pending" "$$completed"
            sha256sum "$$completed" > "$$completed.sha256"
            chmod 600 "$$completed" "$$completed.sha256"
            find /backups -type f \( -name 'wealtharr-*.dump' -o -name 'wealtharr-*.dump.sha256' \) -mtime +30 -delete
            echo "Wealtharr backup archive and checksum created: $$stamp"
          else
            rm -f "$$pending"
            echo "Wealtharr backup failed (archive not published)" >&2
          fi
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  django_secret_key:
    file: ./secrets/django_secret_key

volumes:
  wealtharr_db:
