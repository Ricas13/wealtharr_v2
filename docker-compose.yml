services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wealtharr
      POSTGRES_USER: wealtharr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - wealtharr_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealtharr -d wealtharr"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://wealtharr:${POSTGRES_PASSWORD}@db:5432/wealtharr
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 4
  scheduler:
    image: alpine:3.21
    env_file: .env
    entrypoint:
      - /bin/sh
      - -ec
      - |
        while true; do
          wget -q -O /dev/null --post-data='' --header="Authorization: Bearer $$CRON_TOKEN" http://web:3000/api/cron || true
          sleep 3600
        done
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  wealtharr_postgres: