{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">SECURITY</div><h1>Change password</h1></div><a class="btn btn-subtle" href="{% url 'user_settings' %}">← Settings</a></div>
<div class="panel padded narrow-panel"><form method="post" class="form-stack">{% csrf_token %}{% include 'partials/form_fields.html' with form=form %}<button class="btn btn-primary" type="submit">Update password</button></form></div>
{% endblock %}
