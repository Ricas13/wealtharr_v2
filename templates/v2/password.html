{% extends 'v2/auth_base.html' %}{% block title %}Change password{% endblock %}{% block content %}<section class="w2-panel w2-auth-card"><p class="w2-overline">ACCOUNT SECURITY</p><h1>Change password</h1><form method="post" class="w2-auth-form">{% csrf_token %}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}<button class="w2-button w2-button-primary" type="submit">Update password</button></form><a href="{% url 'v2_settings' %}">Back to Settings</a></section>{% endblock %}
