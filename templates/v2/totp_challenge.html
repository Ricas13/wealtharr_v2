{% extends 'v2/auth_base.html' %}{% block title %}Verify authenticator{% endblock %}{% block content %}<section class="w2-panel w2-auth-card"><p class="w2-overline">SECOND FACTOR</p><h1>Verify your authenticator</h1><p class="w2-muted">Enter the current six-digit code.</p><form method="post" autocomplete="off" class="w2-auth-form">{% csrf_token %}<label for="totp-code">Authenticator code</label><input class="w2-input" id="totp-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus><button class="w2-button w2-button-primary" type="submit">Verify and continue</button></form><p class="w2-note">Verification rate limits remain active.</p><form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="w2-button" type="submit">Sign out</button></form></section>{% endblock %}
