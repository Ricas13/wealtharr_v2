{% extends 'v2/auth_base.html' %}{% block title %}Reset password{% endblock %}{% block content %}<section class="w2-panel w2-auth-card"><h1>Reset your password</h1><form method="post" class="w2-auth-form">{% csrf_token %}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}<button class="w2-button w2-button-primary" type="submit">Email me a link</button></form><a href="{% url 'login' %}">Back to sign in</a></section>{% endblock %}
